function render(){
  const tr=t();
  document.getElementById("tabbar").innerHTML=TABS.map((tab,i)=>`<button class="tab ${S.tab===tab?"active":""}" onclick="sw('${tab}')""><span>${tr.tabs[i][0]}</span>${tr.tabs[i][1]}</button>`).join("");
  const el=document.getElementById("content");
  if(S.tab==="library") el.innerHTML=rLib();
  else if(S.tab==="discover") el.innerHTML=rDisc();
  else if(S.tab==="wotd") el.innerHTML=rWotd();
  else if(S.tab==="notes") el.innerHTML=rNotes();
  else if(S.tab==="boost") el.innerHTML=rBoost();
  else if(S.tab==="game") el.innerHTML=rGame();
}
function sw(tab){S.tab=tab;render()}

// ── LIBRARY ────────────────────────────────────────────────────────────────────
function rLib(){
  const tr=t();
  if(S.showForm) return rForm();
  if(S.delId) return rDel();
  const filtered=S.terms.filter(k=>{const q=S.search.toLowerCase();return!q||k.word.toLowerCase().includes(q)||(k.definition||"").toLowerCase().includes(q);});
  let h=`<div style="padding:10px 12px;background:#faf8f5;border-bottom:1px solid #e8e4de;display:flex;gap:8px">
    <input style="flex:1;padding:8px 10px;border-radius:9px;border:1px solid #ddd;font-size:14px;background:#f0ede8;outline:none;font-family:Georgia,serif" placeholder="${tr.searchPh}" value="${S.search}" oninput="S.search=this.value;render()">
    <button class="btn" style="width:auto;padding:8px 13px;margin:0" onclick="oAdd()">${tr.addBtn}</button>
  </div>`;
  if(!filtered.length){
    h+=`<div class="empty"><div class="emptyicon">📖</div><div class="emptytitle">${S.terms.length===0?tr.noTerms:"No results"}</div><div class="emptydesc">${S.terms.length===0?tr.noTermsDesc:"Try a different search."}</div></div>`;
  }else{
    h+=`<div style="padding:10px 11px 80px">`;
    filtered.forEach(kw=>{
      const c=cc(kw.category);
      h+=`<div class="card ${kw.mastered?"green":""}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
          <span class="pill" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${tr.cats[kw.category]||kw.category}</span>
          <div><button class="iconbtn" onclick="oEdit('${kw.id}')">✎</button><button class="iconbtn" style="color:#ef4444" onclick="S.delId='${kw.id}';render()">✕</button></div>
        </div>
        <div class="word">${kw.word}</div>

function rDisc(){
  const tr=t();
  const db=DB[S.lang]||DB.en;
  const topics=Object.keys(db);
  let h=`<div style="padding:14px 12px 90px"><h2>${tr.discTitle}</h2><p class="desc">${tr.discDesc}</p>`;
  // Step 1
  h+=`<span class="seclbl">${tr.step1}</span><div class="grid2">`;
  topics.forEach(topic=>{
    h+=`<button class="topicbtn ${S.dTopic===topic?"sel":""}" onclick="selTopic('${topic}')"><span style="font-size:18px">${db[topic].icon}</span><span>${topic}</span></button>`;
  });
  h+=`</div>`;
  // Step 2
  if(S.dTopic&&db[S.dTopic]){
    const cats=Object.keys(db[S.dTopic]).filter(k=>k!=="icon");
    h+=`<span class="seclbl">${tr.step2}</span><div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">`;
    cats.forEach(cat=>{
      h+=`<button style="padding:7px 14px;border:${S.dCat===cat?"2px solid #7c3aed":"1px solid #ddd"};border-radius:20px;background:${S.dCat===cat?"#f3e8ff":"#fff"};color:${S.dCat===cat?"#7c3aed":"#475569"};font-size:12px;cursor:pointer;font-family:Georgia,serif;font-weight:${S.dCat===cat?"bold":"normal"}" onclick="selCat('${cat}')">${cat}</button>`;
    });
    h+=`</div>`;
  }
  // Step 3 — terms
  if(S.dTopic&&S.dCat&&db[S.dTopic]&&db[S.dTopic][S.dCat]){
    const terms=db[S.dTopic][S.dCat];
    const selCount=Object.values(S.dSelected).filter(v=>v===true).length;
    h+=`<span class="seclbl">${tr.step3}</span>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button style="font-size:12px;padding:5px 11px;border:1px solid #7c3aed;border-radius:7px;background:#f3e8ff;color:#7c3aed;cursor:pointer;font-family:Georgia,serif" onclick="selAll()">${tr.selectAll}</button>
      <button style="font-size:12px;padding:5px 11px;border:1px solid #ddd;border-radius:7px;background:none;color:#475569;cursor:pointer;font-family:Georgia,serif" onclick="S.dSelected={};render()">${tr.clearAll}</button>
      <span style="font-size:11px;color:#94a3b8;align-self:center">${selCount} selected</span>
    </div>
    <div style="margin-bottom:12px">`;
    terms.forEach((termStr,i)=>{
      const parts=termStr.split("|");
      const word=parts[0];
      const def=parts[1]||"";
      const ex=parts[2]||"";
      const cat=parts[3]||"Other";
      const already=inLib(word);
      const isSel=S.dSelected[i]===true;
      const isDone=S.dSelected[i]==="done";
      h+=`<div onclick="tRes(${i})" style="background:${isDone?"#f0fdf8":isSel?"#faf5ff":"#fff"};border-radius:12px;padding:13px;margin-bottom:8px;border:${isDone?"1.5px solid #6ee7b7":isSel?"2px solid #7c3aed":"1px solid #e8e4de"};cursor:${already||isDone?"default":"pointer"};display:flex;align-items:flex-start;gap:10px">
        <div style="width:20px;height:20px;border-radius:5px;border:2px solid ${isDone?"#6ee7b7":isSel?"#7c3aed":"#ddd"};background:${isDone?"#6ee7b7":isSel?"#7c3aed":"#fff"};display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:11px;color:#fff">${isSel||isDone?"✓":""}</div>
        <div style="flex:1">
          <div style="display:flex;gap:5px;margin-bottom:3px;flex-wrap:wrap">
            <span class="pill" style="background:${cc(cat).bg};color:${cc(cat).text};border:1px solid ${cc(cat).border}">${cat}</span>
            ${already||isDone?`<span style="font-size:10px;color:#6ee7b7;font-weight:bold">${tr.inLib}</span>`:""}
          </div>
          <div style="font-size:15px;font-weight:bold;color:#1a1a2e;margin-bottom:3px">${word}</div>
          <div style="font-size:12px;color:#475569;line-height:1.5">${def}</div>
          ${ex?`<div style="font-size:11px;color:#7c8a9e;font-style:italic;margin-top:3px">"${ex}"</div>`:""}
        </div>
      </div>`;
    });
    h+=`</div>
    <div style="position:sticky;bottom:8px">
      <button class="savebtn ${selCount>0?"active":"inactive"}" onclick="saveSel()">${selCount>0?`${tr.saveSelected} (${selCount})`:tr.saveSelected}</button>
    </div>`;
  }
  h+=`</div>`;
  return h;
}
function selTopic(t){S.dTopic=t;S.dCat=null;S.dSelected={};render()}
function selCat(c){S.dCat=c;S.dSelected={};render()}
function tRes(i){
  const db=DB[S.lang]||DB.en;
  if(!S.dTopic||!S.dCat)return;
  const word=(db[S.dTopic][S.dCat][i]||"").split("|")[0];
  if(inLib(word)||S.dSelected[i]==="done")return;
  S.dSelected[i]=!S.dSelected[i];render();
}
function selAll(){
  const db=DB[S.lang]||DB.en;
  if(!S.dTopic||!S.dCat)return;
  const terms=db[S.dTopic][S.dCat];
  const s={};terms.forEach((_,i)=>{const w=(terms[i]||"").split("|")[0];if(!inLib(w))s[i]=true;});S.dSelected=s;render();
}
function saveSel(){
  const db=DB[S.lang]||DB.en;
  if(!S.dTopic||!S.dCat)return;
  const terms=db[S.dTopic][S.dCat];
  let count=0;
  terms.forEach((termStr,i)=>{
    if(S.dSelected[i]!==true)return;
    const parts=termStr.split("|");
    const word=parts[0],def=parts[1]||"",ex=parts[2]||"",cat=parts[3]||"Other";
    if(inLib(word)||S.terms.length>=25)return;
    S.terms=[{id:Date.now().toString()+Math.random(),word,definition:def,example:ex,translation:"",transLang:S.transLang,category:cat,tags:[],mastered:false,createdAt:new Date().toISOString()},...S.terms];
    count++;
  });
  const ns={};Object.keys(S.dSelected).forEach(i=>{ns[i]="done"});S.dSelected=ns;
  sv();showToast(t().added(count));render();
}

        <div style="font-size:14px;font-weight:bold;color:#1a1a2e">${tip[1]}</div>
      </div>
      <div style="padding:20px 16px 80px">
        <div style="font-size:40px;text-align:center;margin-bottom:14px">${tip[0]}</div>
        <span style="font-size:11px;font-weight:bold;padding:3px 10px;border-radius:20px;background:#f3e8ff;color:#7c3aed;display:inline-block;margin-bottom:14px">${tip[2]}</span>
        <p style="font-size:15px;color:#1a1a2e;line-height:1.8;margin-bottom:20px">${tip[3]}</p>
        <div style="background:#faf5ff;border:1px solid #c4b5fd;border-radius:12px;padding:14px 16px">
          <div style="font-size:12px;font-weight:bold;color:#7c3aed;margin-bottom:6px">💡 ${S.lang==="en"?"Try this":"Essayez ceci"}</div>
          <div style="font-size:14px;color:#4a1d96;line-height:1.7">${tip[4]}</div>
        </div>
      </div>
    </div>`;
  }
  return`<div>
    <div style="padding:12px 14px;background:#faf8f5;border-bottom:1px solid #e8e4de">
      <div style="font-size:16px;font-weight:bold;color:#1a1a2e;margin-bottom:2px">${tr.boostTitle}</div>
      <div style="font-size:12px;color:#94a3b8;line-height:1.4">${tr.boostDesc}</div>
    </div>
    <div style="padding:10px 11px 80px">
      ${tips.map((tip,i)=>`<div class="boostcard" onclick="S.boostOpen=${i};render()">
        <div style="font-size:28px;flex-shrink:0">${tip[0]}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:bold;color:#1a1a2e;margin-bottom:2px">${tip[1]}</div>
          <div style="font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tip[3].slice(0,70)}…</div>
        </div>
        <div style="font-size:12px;color:#7c3aed;font-weight:bold;flex-shrink:0">${tr.read}</div>
      </div>`).join("")}
    </div>
  </div>`;
}

// ── GAME ───────────────────────────────────────────────────────────────────────
function rGame(){
  const tr=t();const playable=S.terms.filter(k=>k.definition?.trim());
  if(playable.length<6)return`<div class="empty"><div class="emptyicon">🎮</div><div class="emptytitle">${tr.notEnough}</div></div>`;
  if(S.gameState==="setup")return`<div style="display:flex;align-items:center;justify-content:center;padding:20px;min-height:400px">
    <div class="card" style="text-align:center;max-width:340px;width:100%">
      <div style="font-size:34px;margin-bottom:8px">🎮</div>
      <p class="desc">${tr.gameDesc}</p>
      <p style="font-size:12px;font-weight:bold;color:#475569;margin-bottom:10px">${tr.pickDiff}</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px">
        ${["easy","medium","hard"].map(d=>`<button onclick="S.gameDiff='${d}';render()" style="padding:7px 13px;border:${S.gameDiff===d?"2px solid #7c3aed":"1px solid #ddd"};border-radius:8px;background:${S.gameDiff===d?"#f3e8ff":"none"};color:${S.gameDiff===d?"#7c3aed":"#475569"};font-size:12px;cursor:pointer;font-family:Georgia,serif;font-weight:${S.gameDiff===d?"bold":"normal"}">${tr[d]}</button>`).join("")}
      </div>
      <button class="btn" onclick="startGame()">${tr.play}</button>
    </div>
  </div>`;
  if(S.gameState==="won")return`<div style="display:flex;align-items:center;justify-content:center;padding:20px;min-height:400px">
    <div class="card" style="text-align:center;max-width:300px;width:100%">
      <div style="font-size:48px;margin-bottom:8px">🏆</div>
      <h2 style="margin-bottom:8px">${tr.won}</h2>
      <p class="desc">${tr.wonDesc(S.gameMoves,S.gameSecs)}</p>
      <button class="btn" onclick="S.gameState='setup';render()">${tr.playAgain}</button>
    </div>
  </div>`;
  const cols=S.gameCards.length<=12?3:4;
  return`<div>
    <div style="display:flex;gap:12px;align-items:center;padding:8px 14px;background:#faf8f5;border-bottom:1px solid #e8e4de;flex-wrap:wrap">
      <span style="font-size:12px;color:#64748b">${tr.moves}: <b>${S.gameMoves}</b></span>
      <span style="font-size:12px;color:#64748b">${tr.matched}: <b>${S.gameMatched.length}/${S.gameCards.length/2}</b></span>
      <span style="font-size:12px;color:#64748b">${tr.time}: <b>${S.gameSecs}s</b></span>
      <button class="btn outline" style="width:auto;padding:5px 12px;margin:0;font-size:12px;margin-left:auto" onclick="S.gameState='setup';clearInterval(gameTimer);render()">${tr.playAgain}</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:8px;padding:10px;padding-bottom:80px">
      ${S.gameCards.map((card,i)=>{
        const flp=S.gameFlipped.find(f=>f.id===card.id)||S.gameMatched.includes(card.pairId);
        const mat=S.gameMatched.includes(card.pairId);
        return`<div onclick="flipCard(${i})" style="background:${mat?"#f0fdf8":flp?"#fff":"#120f2e"};border-radius:10px;min-height:80px;cursor:${mat?"default":"pointer"};display:flex;align-items:center;justify-content:center;border:2px solid ${mat?"#6ee7b7":flp?"#7c3aed":"transparent"};padding:6px;transition:background 0.15s">
          ${flp?`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;width:100%"><div style="font-size:7px;letter-spacing:2px;color:#94a3b8;font-family:monospace">${card.type==="term"?tr.termCard:tr.defCard}</div><div style="font-size:11px;color:#1a1a2e;text-align:center;line-height:1.3;font-weight:bold">${card.content}</div></div>`:`<div style="font-size:20px;color:rgba(255,255,255,0.1);font-weight:bold">?</div>`}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
function startGame(){
  const playable=S.terms.filter(k=>k.definition?.trim());
  const pairCount=S.gameDiff==="easy"?6:S.gameDiff==="medium"?10:16;
  const pool=shuf(playable).slice(0,pairCount);
  const built=[];
  pool.forEach((term,i)=>{built.push({id:`t${i}`,pairId:i,type:"term",content:term.word});built.push({id:`d${i}`,pairId:i,type:"def",content:term.definition.length>80?term.definition.slice(0,80)+"…":term.definition});});
  S.gameCards=shuf(built);S.gameFlipped=[];S.gameMatched=[];S.gameMoves=0;S.gameSecs=0;S.gameLocked=false;S.gameState="playing";
  clearInterval(gameTimer);gameTimer=setInterval(()=>{S.gameSecs++;render();},1000);
  render();
}
function flipCard(i){
  const card=S.gameCards[i];
  if(S.gameLocked||S.gameFlipped.length>=2||S.gameFlipped.find(f=>f.id===card.id)||S.gameMatched.includes(card.pairId))return;
  const nf=[...S.gameFlipped,card];S.gameFlipped=nf;
  if(nf.length===2){
    S.gameMoves++;S.gameLocked=true;
    if(nf[0].pairId===nf[1].pairId){const nm=[...S.gameMatched,nf[0].pairId];S.gameMatched=nm;S.gameFlipped=[];S.gameLocked=false;if(nm.length===S.gameCards.length/2){clearInterval(gameTimer);S.gameState="won";}}
    else setTimeout(()=>{S.gameFlipped=[];S.gameLocked=false;render();},900);
  }
  render();
}

// ── INIT ───────────────────────────────────────────────────────────────────────
document.getElementById("langbtn").textContent=S.lang==="en"?"FR":"EN";
render();
</script>
